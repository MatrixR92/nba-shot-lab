*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:400 16px/1.45 var(--fb);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:inherit}

.cc{grid-area:c;align-self:stretch}.dd{grid-area:d}

.hr{display:flex;gap:8px;position:relative}
.pop{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:6;display:grid;min-width:200px;box-shadow:0 8px 24px #0004}
.pop[hidden]{display:none}.pop button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.pop button:hover{background:var(--hov)}.pop button[hidden]{display:none}
#opp{font-size:14px;padding:6px 34px 6px 12px}
.cmt:empty{display:none}.cmt ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}.cmt li{background:var(--tile);border-radius:10px;padding:8px 12px}.cmt b{color:var(--act)}

.tip[hidden]{display:none}.tip b{display:block;font:700 18px/1.1 var(--fh);margin-bottom:2px}.tip .ok{color:var(--act);font-weight:600}.tip .ko{color:var(--mut);font-weight:600}
.tip button{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px;line-height:1}
.ring{fill:none;stroke:var(--txt);stroke-width:2}
.rpb{display:flex;align-items:center;gap:12px;margin-top:14px}
.rpb button{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#0a0e15;cursor:pointer;display:grid;place-items:center}
.rpb #rpr{background:var(--grpbg);color:var(--txt)}.rpb input{flex:1;min-width:0;accent-color:var(--acc)}.rpl{margin-top:6px;font-size:13px;color:var(--mut)}
#court.rp .hex{animation:none}
.sec{margin-top:24px}
#cmt2{grid-column:1/-1}#cmt2 ul{margin:0;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:861px){.cc .cmt{display:none}}
@media(max-width:860px){#cmt2{display:none}}
#more{grid-area:x;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.hw{display:grid;grid-template-columns:minmax(0,130px) 1fr 40px 62px;gap:10px;align-items:center;margin-bottom:12px;font-size:14px}
.hw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb{height:10px;background:var(--tile);border-radius:6px;overflow:hidden}.hb i{display:block;height:100%;background:var(--act);border-radius:6px}
.hw em{font-style:normal;color:var(--mut);text-align:right}.hw b{font:700 18px/1 var(--fh);text-align:right}
.tch{width:100%;height:auto;display:block}.tch .gl line{stroke:var(--line)}.tch text{fill:var(--mut);font-size:16px}
.tch .av{stroke:var(--mut);stroke-dasharray:6 6;stroke-width:1.5}.tch .tl{fill:none;stroke:var(--act);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.hist u{gap:2px}.hist u i{flex:1;width:auto}
@media(max-width:700px){#cards,.two{grid-template-columns:1fr}.one{max-width:none}}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr);grid-template-areas:"h" "c" "d" "x";grid-template-rows:auto}#more{grid-template-columns:1fr}.ph{flex-basis:40%}}
@media(max-width:560px){.note{margin-left:0;flex-basis:100%}.hist{gap:3px}.hist small{display:none}.hist em,.hist span{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

  <div class="brand">SHOT<i>LAB</i></div>

<script>
const $=s=>document.querySelector(s),DATA='data/';
const COL={37:'#E03A3E',38:'#2FB463',39:'#FDBB30',40:'#B4975A',41:'#CE1141',42:'#00A3E0',43:'#FEC524',44:'#FFC72C',45:'#CE1141',46:'#E8334A',47:'#FDB927',48:'#F9423A',49:'#2EBD59',50:'#78BE20',51:'#A1A1AA',52:'#F58426',53:'#0F96E6',54:'#FDBB30',55:'#2E8BE6',56:'#E56020',57:'#E03A3E',58:'#8E6DD0',59:'#C4CED4',60:'#29A3F2',61:'#CE1141',62:'#F9A01B',63:'#5D76A9',64:'#E31837',65:'#E8334A',66:'#00A3B8'};
const FALL='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1e293b"/><circle cx="50" cy="38" r="18" fill="#475569"/><path d="M14 100c4-30 20-38 36-38s32 8 36 38z" fill="#475569"/></svg>');
const S={view:'heat',st:'a',ty:'a',rs:'a',q:'a',cv:'side',cmp:0,tgt:'b',opp:'',rp:null},cache=new Map();
let P=[],T={},L={},M={},cur,season,sh,cur2,season2,sh2;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const J=u=>fetch(u).then(r=>{if(!r.ok)throw Error(u);return r.json()});
const pct=(a,b)=>b?(100*a/b).toFixed(1):'–';
const photo=id=>`https://cdn.nba.com/headshots/nba/latest/1040x760/${id}.png`;
const tot=p=>Object.values(p.s).reduce((a,x)=>a+x.fga,0);
const lerp=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const paint=d=>`fill="${col(d)}"`;

const FAM=[['Schiacciate',/dunk/],['Ganci',/hook/],['Fadeaway',/fadeaway/],['Step-back',/step back/],['Pull-up',/pullup/],['Floater',/floating/],['Dalla tabella',/bank/],['Turnaround',/turnaround/],['Entrate e appoggi',/layup|finger roll|tip|putback/],['Jump shot',/jump shot|jumper/]];
function how(a){
  const lk=sh.lookups.action.map(t=>{const l=t.toLowerCase();return(FAM.find(f=>f[1].test(l))||['Altro'])[0]}),G={};
  a.forEach(s=>{const f=lk[s[8]],o=G[f]||(G[f]={n:0,m:0});o.n++;o.m+=s[2]});
  const r=Object.entries(G).sort((x,y)=>y[1].n-x[1].n);
  if(!r.length)return'';
  const mx=r[0][1].n;
  return'<h2>Come tira<small>tipo di tiro, quota sul totale e % di realizzazione</small></h2>'+r.map(([f,o])=>`<div class="hw"><span>${f}</span><div class="hb"><i style="width:${100*o.n/mx}%"></i></div><em>${(100*o.n/a.length).toFixed(0)}%</em><b>${(100*o.m/o.n).toFixed(0)}% FG</b></div>`).join('')}
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'],dl=d=>{const t=String(d);return+t.slice(6)+' '+MESI[+t.slice(4,6)-1]};
function trend(a){
  const H='<h2>Andamento nella stagione<small>FG% sulle ultime 10 partite</small></h2>',D=new Map();

  const avg=100*a.reduce((t,x)=>t+x[2],0)/a.length,V=R.slice(s0);

  const full=R.map((v,i)=>({v,i})).filter(o=>o.i>=W-1&&o.i>=s0),b=[...full].sort((x,y)=>y.v-x.v)[0],w=[...full].sort((x,y)=>x.v-y.v)[0];
  const note=full.length>1?`<ul><li><b>Miglior periodo:</b> ${b.v.toFixed(0)}% nelle ${W} partite fino al ${dl(G[b.i].d)}</li><li><b>Periodo più freddo:</b> ${w.v.toFixed(0)}% nelle ${W} partite fino al ${dl(G[w.i].d)}</li></ul>`:'';
  return H+`<svg class="tch" viewBox="0 0 600 250" role="img" aria-label="Andamento della percentuale dal campo"><g class="gl">${gr}</g><line class="av" x1="48" x2="588" y1="${Y(avg)}" y2="${Y(avg)}"/><polyline class="tl" points="${pts.join(' ')}"/>${dots.join('')}<text x="588" y="${Y(avg)-7}" text-anchor="end">media ${avg.toFixed(0)}%</text><text x="48" y="240">${dl(G[0].d)}</text><text x="318" y="240" text-anchor="middle">${G.length} partite</text><text x="588" y="240" text-anchor="end">${dl(G[G.length-1].d)}</text></svg><div class="cmt">${note}</div>`}
const PLAY='<svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>',PAUSE='<svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor"/></svg>';
